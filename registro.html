<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Periódico Digital</title>
    <style>
        /* Estilos específicos para los campos de entrada */
        .input-with-icon input[type="text"],
        .input-with-icon input[type="email"],
        .input-with-icon input[type="password"] {
            width: 100% !important;
            padding: 0.875rem 1rem 0.875rem 2.75rem !important;
            border: 1.5px solid #e2e8f0 !important;
            border-radius: 8px !important;
            font-size: 0.9375rem !important;
            transition: all 0.3s ease !important;
            background-color: #f8fafc !important;
            color: #1e293b !important;
            height: 48px !important;
            box-sizing: border-box !important;
            font-weight: 400 !important;
            letter-spacing: -0.01em !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif !important;
        }
        
        .input-with-icon input[type="text"]:hover,
        .input-with-icon input[type="email"]:hover,
        .input-with-icon input[type="password"]:hover {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
        
        .input-with-icon input[type="text"]:focus,
        .input-with-icon input[type="email"]:focus,
        .input-with-icon input[type="password"]:focus {
            outline: none !important;
            background-color: #ffffff !important;
            border-color: #6d28d9 !important;
            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2) !important;
            border-left: 3px solid #6d28d9 !important;
        }
        
        .input-with-icon input::placeholder {
            color: #9ca3af !important;
            opacity: 1 !important;
        }
        
        .input-with-icon input:focus + i {
            color: #6d28d9 !important;
        }
    </style>
    <link rel="stylesheet" href="css/registro.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente SF Pro -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display" />
    <!-- Fuentes de respaldo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Estilos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon -->
        <link rel="icon" type="image/png" href="/img/logo_small.png">
    <!-- Preconexión para mejorar el rendimiento de carga de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.cdnfonts.com/css/sf-pro-display">
    <style>
        /* Prevenir el parpadeo de texto durante la carga de fuentes */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
        /* Aplicar SF Pro cuando esté cargada */
        .sf-pro-loaded body { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
    </style>
    <script>
        // Aplicar clase cuando las fuentes estén cargadas
        document.documentElement.classList.add('sf-pro-loading');
        document.fonts.ready.then(function() {
            document.documentElement.classList.remove('sf-pro-loading');
            document.documentElement.classList.add('sf-pro-loaded');
        });
    </script>
    </style>
</head>
<body class="sf-pro-loading">
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <h1>Crear Cuenta</h1>
                <p>Únete a nuestra comunidad</p>
            </div>
            
            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" name="fullName" placeholder="Nombre completo" required>
                    </div>
                    <span class="error-message" id="nameError"></span>
                </div>
                
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-requirements">
                        <span id="length" class="requirement">Mínimo 8 caracteres</span>
                        <span id="uppercase" class="requirement">Una mayúscula</span>
                        <span id="number" class="requirement">Un número</span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>
                
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar contraseña" required>
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
                
                <div class="form-group terms">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkmark"></span>
                        Acepto los <a href="#" class="terms-link">Términos y Condiciones</a> y la <a href="#" class="terms-link">Política de Privacidad</a>
                    </label>
                    <span class="error-message" id="termsError"></span>
                </div>
                
                <button type="submit" class="btn-register" id="registerButton">
                    <span class="btn-text">Crear Cuenta</span>
                    <div class="loader"></div>
                </button>
                
                <div class="login-link">
                    ¿Ya tienes una cuenta? <a href="iniciar-sesion.html" class="login-link-text">Inicia sesión</a>
                </div>
            </form>
            
            <div class="social-login">
                <p>O regístrate con</p>
                <div class="social-buttons">
                    <button type="button" class="social-btn google" id="googleSignIn" onclick="window.location.href='/periodico-digital/google_auth.php'">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                        <span id="googleText">Continuar con Google</span>
                        <div id="googleLoader" class="loader" style="display: none;"></div>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="register-image">
            <div class="image-overlay">
                <h2>Bienvenido a Periódico Digital</h2>
                <p>Únete a nuestra comunidad y mantente informado con las últimas noticias y actualizaciones.</p>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <!-- Script de registro -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('registerForm');
        const registerButton = document.getElementById('registerButton');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termsCheckbox = document.getElementById('terms');
        const togglePasswordBtns = document.querySelectorAll('.toggle-password');
        
        // Obtener token CSRF al cargar la página
        fetch('/php/csrf-token.php')
            .then(response => response.json())
            .then(data => {
                if (data && data.token) {
                    // Almacenar el token CSRF en el formulario
                    const csrfToken = document.createElement('input');
                    csrfToken.type = 'hidden';
                    csrfToken.name = 'csrf_token';
                    csrfToken.value = data.token;
                    registerForm.appendChild(csrfToken);
                }
            })
            .catch(error => {
                console.error('Error al obtener token CSRF:', error);
                showError('Error al cargar el formulario. Por favor, recarga la página.');
            });
        
        // Mostrar/ocultar contraseña
        togglePasswordBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const isPasswordVisible = input.type === 'text';
                input.type = isPasswordVisible ? 'password' : 'text';
                this.setAttribute('aria-pressed', !isPasswordVisible);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
        });
        
        // Validación en tiempo real de la contraseña
        const passwordRequirements = {
            length: document.getElementById('length'),
            uppercase: document.getElementById('uppercase'),
            number: document.getElementById('number')
        };
        
        passwordInput.addEventListener('input', function() {
            validatePasswordStrength(this.value);
            clearFieldError(this);
        });
        
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value === passwordInput.value) {
                clearFieldError(this);
            }
        });
        
        // Validar fortaleza de la contraseña
        function validatePasswordStrength(password) {
            // Mínimo 8 caracteres
            const isLengthValid = password.length >= 8;
            // Al menos una mayúscula
            const hasUppercase = /[A-Z]/.test(password);
            // Al menos un número
            const hasNumber = /\d/.test(password);
            
            // Actualizar indicadores visuales
            updateRequirement('length', isLengthValid);
            updateRequirement('uppercase', hasUppercase);
            updateRequirement('number', hasNumber);
            
            return isLengthValid && hasUppercase && hasNumber;
        }
        
        function updateRequirement(id, isValid) {
            const element = passwordRequirements[id];
            if (element) {
                element.style.color = isValid ? '#10b981' : '#6b7280';
                element.style.fontWeight = isValid ? '600' : 'normal';
            }
        }
        
        // Manejar el envío del formulario
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validar campos
            if (!validateForm()) {
                return;
            }
            
            // Mostrar estado de carga
            setLoading(true);
            
            try {
                // Obtener datos del formulario
                const formData = {
                    name: fullNameInput.value.trim(),
                    email: emailInput.value.trim().toLowerCase(),
                    password: passwordInput.value,
                    confirm_password: confirmPasswordInput.value,
                    terms: termsCheckbox.checked,
                    csrf_token: document.querySelector('input[name="csrf_token"]').value
                };
                
                console.log('Enviando datos de registro:', { ...formData, password: '***' });
                
                // Enviar datos al servidor
                const response = await fetch('/php/process-register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json().catch(() => ({
                    success: false,
                    message: 'Error al procesar la respuesta del servidor'
                }));
                
                console.log('Respuesta del servidor:', result);
                
                if (result.success) {
                    // Mostrar mensaje de éxito y redirigir
                    showNotification('¡Registro exitoso! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = result.redirect || '/perfil.html';
                    }, 1500);
                } else {
                    showError(result.message || 'Error al registrar el usuario. Por favor, inténtalo de nuevo.');
                }
                
            } catch (error) {
                console.error('Error al enviar el formulario:', error);
                showError('Error de conexión. Por favor, inténtalo de nuevo más tarde.');
            } finally {
                setLoading(false);
            }
        });
        
        // Función para validar el formulario
        function validateForm() {
            let isValid = true;
            
            // Validar nombre completo
            if (!fullNameInput.value.trim()) {
                showFieldError(fullNameInput, 'El nombre completo es obligatorio');
                isValid = false;
            } else if (fullNameInput.value.trim().length < 3) {
                showFieldError(fullNameInput, 'El nombre debe tener al menos 3 caracteres');
                isValid = false;
            } else {
                clearFieldError(fullNameInput);
            }
            
            // Validar email
            if (!emailInput.value.trim()) {
                showFieldError(emailInput, 'El correo electrónico es obligatorio');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
                showFieldError(emailInput, 'Ingresa un correo electrónico válido');
                isValid = false;
            } else {
                clearFieldError(emailInput);
            }
            
            // Validar contraseña
            if (!passwordInput.value) {
                showFieldError(passwordInput, 'La contraseña es obligatoria');
                isValid = false;
            } else if (!validatePasswordStrength(passwordInput.value)) {
                showFieldError(passwordInput, 'La contraseña no cumple con los requisitos');
                isValid = false;
            } else {
                clearFieldError(passwordInput);
            }
            
            // Validar confirmación de contraseña
            if (!confirmPasswordInput.value) {
                showFieldError(confirmPasswordInput, 'Debes confirmar tu contraseña');
                isValid = false;
            } else if (confirmPasswordInput.value !== passwordInput.value) {
                showFieldError(confirmPasswordInput, 'Las contraseñas no coinciden');
                isValid = false;
            } else {
                clearFieldError(confirmPasswordInput);
            }
            
            // Validar términos y condiciones
            if (!termsCheckbox.checked) {
                showFieldError(termsCheckbox, 'Debes aceptar los términos y condiciones');
                isValid = false;
            } else {
                clearFieldError(termsCheckbox);
            }
            
            return isValid;
        }
        
        // Función para mostrar error en un campo
        function showFieldError(input, message) {
            let errorElement;
            
            if (input.type === 'checkbox') {
                errorElement = document.getElementById('termsError');
            } else {
                errorElement = document.getElementById(`${input.id}Error`);
            }
            
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                
                if (input.setAttribute) {
                    input.setAttribute('aria-invalid', 'true');
                    input.classList.add('error');
                }
            }
        }
        
        // Función para limpiar error de un campo
        function clearFieldError(input) {
            let errorElement;
            
            if (input.type === 'checkbox') {
                errorElement = document.getElementById('termsError');
            } else {
                errorElement = document.getElementById(`${input.id}Error`);
            }
            
            if (errorElement) {
                errorElement.textContent = '';
                errorElement.style.display = 'none';
                
                if (input.setAttribute) {
                    input.setAttribute('aria-invalid', 'false');
                    input.classList.remove('error');
                }
            }
        }
        
        // Función para mostrar notificación
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            if (notification) {
                notification.textContent = message;
                notification.className = `notification ${type}`;
                notification.style.display = 'block';
                
                // Ocultar después de 5 segundos
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 5000);
            }
        }
        
        // Función para mostrar mensaje de error
        function showError(message) {
            showNotification(message, 'error');
            
            // Desplazarse al primer error
            const firstError = document.querySelector('.error-message[style*="display: block"]');
            if (firstError) {
                firstError.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        
        // Función para mostrar/ocultar estado de carga
        function setLoading(isLoading) {
            if (isLoading) {
                registerButton.disabled = true;
                registerButton.querySelector('.btn-text').textContent = 'Creando cuenta...';
                registerButton.querySelector('.loader').style.display = 'inline-block';
            } else {
                registerButton.disabled = false;
                registerButton.querySelector('.btn-text').textContent = 'Crear Cuenta';
                registerButton.querySelector('.loader').style.display = 'none';
            }
        }
    });
    </script>
    
    <style>
    .social-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 20px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
        color: #444;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        margin-bottom: 10px;
    }

    .social-btn.google {
        background: #fff;
        border: 1px solid #ccc;
    }

    .social-btn.google:hover {
        background: #f5f5f5;
        border-color: #aaa;
    }

    .social-btn img {
        width: 18px;
        height: 18px;
    }

    .loader {
        border: 2px solid #f3f3f3;
        border-top: 2px solid #4285f4;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        animation: spin 0.8s linear infinite;
        margin-left: 10px;
        display: none;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const googleBtn = document.getElementById('googleSignIn');
        if (googleBtn) {
            googleBtn.addEventListener('click', function(e) {
                const googleText = document.getElementById('googleText');
                const googleLoader = document.getElementById('googleLoader');
                
                if (googleText && googleLoader) {
                    // Mostrar indicador de carga
                    googleText.textContent = 'Iniciando sesión...';
                    googleLoader.style.display = 'block';
                    
                    // Deshabilitar el botón
                    this.disabled = true;
                    
                    // Redirigir después de un pequeño retraso para que el usuario vea el feedback
                    setTimeout(() => {
                        window.location.href = 'google_auth.php';
                    }, 300);
                }
            });
        }
    });
    </script>
    
    <!-- Removed registro.min.js as we're using inline JavaScript -->
</body>
</html>
