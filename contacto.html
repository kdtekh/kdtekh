<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - KDTekh</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        textarea { height: 120px; resize: vertical; }
        button { background: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; }
        #status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .newsletter { display: flex; align-items: center; gap: 0.5rem; }
        .newsletter input { width: auto; }
    </style>
</head>
<body>
    <h1>Contacto</h1>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Nombre *</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-group">
            <label for="subject">Asunto *</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
            <label for="message">Mensaje *</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <div class="form-group newsletter">
            <input type="checkbox" id="newsletter" name="newsletter" value="1">
            <label for="newsletter">Suscribirse al newsletter</label>
        </div>
        <button type="submit">Enviar Mensaje</button>
    </form>
    <div id="status"></div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const statusDiv = document.getElementById('status');
            
            // Recopilar datos del formulario
            const data = {
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                phone: form.phone.value.trim(),
                subject: form.subject.value.trim(),
                message: form.message.value.trim(),
                newsletter: form.newsletter.checked ? 1 : 0
            };

            // Validación básica
            if (!data.name || !data.email || !data.subject || !data.message) {
                statusDiv.textContent = 'Por favor, completa todos los campos obligatorios.';
                statusDiv.className = 'status error';
                return;
            }

            statusDiv.textContent = 'Enviando mensaje...';
            statusDiv.className = 'status';

            try {
                // URL real del webhook de n8n
                const N8N_WEBHOOK_URL = 'https://aironsdie.app.n8n.cloud/webhook/kdtekh-contact';

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    statusDiv.textContent = result.message || 'Mensaje enviado correctamente.';
                    statusDiv.className = 'status success';
                    form.reset();
                } else {
                    throw new Error(result.message || 'Respuesta inesperada del servidor');
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = 'Error al enviar el mensaje. Por favor, intenta de nuevo más tarde.';
                statusDiv.className = 'status error';
            }
        });

        // YA NO ES NECESARIO — eliminar o comentar:
        // fetch('/php/csrf-token.php')
        //     .then(response => response.json())
        //     .then(data => { ... })
    </script>
</body>
</html>
