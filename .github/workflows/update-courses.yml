name: Update Courses CSV

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'cursos.html'

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract courses from HTML
        run: python3 scripts/extract-courses.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/cursos.csv
          git diff --staged --quiet || git commit -m "chore: update cursos.csv from cursos.html"
          git push